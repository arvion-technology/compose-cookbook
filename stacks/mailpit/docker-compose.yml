# Mailpit catches all outbound SMTP during development. The UI is a localhost
# convenience; there is no reason to expose it to a network.
name: arvion-mailpit

services:
  mailpit:
    image: axllent/mailpit:v1.21.7
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: ${MAILPIT_MAX_MESSAGES:-500}
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    mem_limit: 128m
    cpus: 0.25
    networks:
      - mail

networks:
  mail:
    driver: bridge
