# An nginx reverse proxy with TLS termination. The config is mounted read-only;
# certificates live in a named volume that a certbot sidecar can write to later.
name: arvion-nginx-proxy

services:
  nginx:
    image: nginx:1.27.2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    mem_limit: 128m
    cpus: 0.5
    networks:
      - edge

volumes:
  certs:

networks:
  edge:
    driver: bridge
