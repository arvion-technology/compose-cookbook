# LocalStack with S3 and SQS only. The gateway is bound to localhost; keep the
# service list short so startup stays quick and the emulated surface is clear.
name: arvion-localstack-lite

services:
  localstack:
    image: localstack/localstack:3.8.1
    restart: unless-stopped
    environment:
      SERVICES: ${LOCALSTACK_SERVICES:-s3,sqs}
      DEBUG: ${LOCALSTACK_DEBUG:-0}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      PERSISTENCE: "1"
    ports:
      - "127.0.0.1:${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 30s
    mem_limit: 768m
    cpus: 1.0
    networks:
      - emulated-cloud

volumes:
  localstack-data:

networks:
  emulated-cloud:
    driver: bridge
